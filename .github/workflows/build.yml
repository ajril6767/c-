name: Build C++

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

- name: Show files
  shell: cmd
  run: |
    echo Current directory:
    cd
    echo.
    echo Files:
    dir /s /b

- name: Compile
  shell: cmd
  run: |
    g++ main.cpp -o program.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: program.exe
