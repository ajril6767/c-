name: Build C++ EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build EXE
        shell: cmd
        run: |
          g++ "%GITHUB_WORKSPACE%\main.cpp" -o "%GITHUB_WORKSPACE%\program.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: program.exe
